[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-support-lora"
version = "0.1.0"
description = "Arabic-English support model training and reproducible evaluation"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.119,<1", "uvicorn[standard]>=0.37,<1", "httpx>=0.28,<1", "scikit-learn>=1.7,<2", "numpy>=2.2,<3"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]

train = ["torch>=2.6,<3", "transformers>=4.57,<5", "peft>=0.17,<0.19", "accelerate>=1.10,<2"]
qlora = ["bitsandbytes>=0.47,<0.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_lora = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
